name: Build and Release

on:
  release:
    types: [created]
  push:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Try to restore Rust artifacts from the cache
        uses: tecolicom/actions-use-homebrew-tools@v1

      - name: Check Rust version
        run: |
          rustc --version
          cargo --version

      - name: Install targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-apple-ios x86_64-linux-android
          rustup target list --installed

      - name: Install dependencies
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: protobuf

      - name: Try to build everyting
        run: |
          make all

      - name: Lint
        run: cargo clippy --all-targets --all-features --workspace

